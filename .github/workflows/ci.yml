name: Verify
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pragma
          POSTGRES_PASSWORD: integration_password
          POSTGRES_DB: pragma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U pragma -d pragma_test'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://pragma:integration_password@127.0.0.1:5432/pragma_test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: integration_test_password
      TRAINER_TOKEN: integration_service_token
      PARTITION_SECRET: '0101010101010101010101010101010101010101010101010101010101010101'
      TRAINER_URL: http://127.0.0.1:8001
      PUBLIC_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
      TEST_DATABASE_URL: postgres://pragma:integration_password@127.0.0.1:5432/pragma_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: |
          python -m venv services/trainer/.venv
          services/trainer/.venv/bin/pip install -r services/trainer/requirements.lock
          services/trainer/.venv/bin/pytest services/trainer/tests
          python -m unittest discover -s scripts/tests
      - run: |
          mkdir -p build
          cargo build -p pragma-api -p pragma-engine
          services/trainer/.venv/bin/uvicorn app:app --app-dir services/trainer --port 8001 > build/trainer.log 2>&1 &
          target/debug/pragma-api > build/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          python scripts/test-api.py
      - run: |
          scripts/build-nginx.sh > build/nginx-build.log 2>&1
          python scripts/test-nginx.py
          python scripts/test-remote-helper.py
      - working-directory: apps/portal
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm start > ../../build/portal.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login > /dev/null && break || sleep 1; done
          pnpm test:e2e
      - run: python scripts/test-release-deployment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-artifacts
          path: |
            build/*.log
            build/screenshots/
            build/nginx/modules/ngx_http_pragmachange_module.so
