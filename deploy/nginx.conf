load_module modules/ngx_http_pragmachange_module.so;
worker_processes 2;
error_log /dev/stderr info;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    pragmachange_zone 64m;
    pragmachange_release /etc/nginx/pragmachange/current/release.json;
    pragmachange_secret_file /etc/nginx/pragmachange/partition_secret;
    server {
        listen 8081;
        server_name api.example.test;
        location / {
            pragmachange on;
            proxy_pass http://upstream:9000;
        }
    }
}
